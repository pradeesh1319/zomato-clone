<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zomato Clone — Discover the best food & drinks</title>
  <meta name="description" content="Find the best restaurants, cafes and bars near you. Order food online or explore menus, ratings, and reviews." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
</head>
<body>

  <!-- ═══════ NAVBAR ═══════ -->
  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">🍽️</div>
        <span>foodie</span>
      </a>

      <div class="search-container">
        <div class="search-bar" id="search-bar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Search for restaurants, cuisines, or locations..." autocomplete="off" />
        </div>
      </div>

      <div class="nav-location">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        Bangalore
      </div>
    </div>
  </nav>

  <!-- ═══════ HERO ═══════ -->
  <section class="hero">
    <h1>Discover the <span class="highlight">best food</span><br/>around you</h1>
    <p>Explore top-rated restaurants, browse menus, and find your next favourite meal.</p>
  </section>

  <!-- ═══════ CUISINE FILTERS ═══════ -->
  <section class="filter-section">
    <div class="filter-pills" id="filter-pills">
      <button class="filter-pill active" data-filter="all">🔥 All</button>
      <button class="filter-pill" data-filter="pizza">🍕 Pizza</button>
      <button class="filter-pill" data-filter="burgers">🍔 Burgers</button>
      <button class="filter-pill" data-filter="biryani">🍚 Biryani</button>
      <button class="filter-pill" data-filter="chinese">🥡 Chinese</button>
      <button class="filter-pill" data-filter="south indian">🫓 South Indian</button>
      <button class="filter-pill" data-filter="japanese">🍱 Japanese</button>
      <button class="filter-pill" data-filter="desserts">🍨 Desserts</button>
      <button class="filter-pill" data-filter="cafe">☕ Cafe</button>
    </div>
  </section>

  <!-- ═══════ RESTAURANT LISTING ═══════ -->
  <main class="restaurants-section">
    <div class="section-header">
      <h2>Restaurants Near You</h2>
      <span class="restaurant-count" id="restaurant-count"></span>
    </div>
    <div class="restaurant-grid" id="restaurant-grid">
      <!-- Skeleton loaders shown while fetching -->
    </div>
  </main>

  <!-- ═══════ FOOTER ═══════ -->
  <footer class="footer">
    Made with ❤️ — <span>foodie</span> clone project
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
